<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f766e">
  <meta name="referrer" content="no-referrer">
  <title>Ahuja Dental Clinic — Patient Thank-You Tool</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="card">
    <header class="brand">
      <span class="logo" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"><path d="M7 3.5c-2.3 0-4 1.8-4 4.4 0 2 .8 3.4 1.5 5 .7 1.7.7 3.6 1.2 5.3.4 1.3 1.1 2.3 2 2.3 1.6 0 1.6-3.8 3.3-3.8s1.7 3.8 3.3 3.8c.9 0 1.6-1 2-2.3.5-1.7.5-3.600 1.2-5.300.7-1.6 1.5-3 1.5-5 0-2.6-1.7-4.4-4-4.4-1.800 0-2.6 1-4 1s-2.200-1-4-1z"/></svg>
      </span>
      <div>
        <h1>Ahuja Dental Clinic</h1>
        <p class="subtitle">Patient Thank-You Tool</p>
      </div>
    </header>
    <p class="intro">Send a personalized thank-you message to a patient on WhatsApp in seconds.</p>
    <form id="form" novalidate autocomplete="off">
      <div class="field">
        <label for="phone">Patient Mobile Number</label>
        <div class="phone-wrap">
          <span class="prefix" aria-hidden="true">🇮🇳 +91</span>
          <input id="phone" type="tel" inputmode="tel" autocomplete="off" placeholder="Enter 10-digit mobile number" aria-describedby="phone-error" maxlength="20">
        </div>
        <p id="phone-error" class="error" role="alert" hidden></p>
      </div>
      <div class="field">
        <label for="name">Patient Name <span class="optional">(Optional)</span></label>
        <input id="name" type="text" autocomplete="off" placeholder="Enter patient name" maxlength="60">
      </div>
      <section class="preview" aria-labelledby="preview-title">
        <div class="preview-head">
          <h2 id="preview-title">Message Preview</h2>
          <div class="preview-actions">
            <button type="button" id="reset-btn" class="link-btn" hidden>Reset message</button>
            <button type="button" id="edit-btn" class="link-btn" aria-expanded="false">Edit Message</button>
          </div>
        </div>
        <div id="preview" class="bubble" aria-live="polite"></div>
        <textarea id="editor" class="bubble editor" rows="11" aria-label="Edit message" hidden></textarea>
      </section>
      <button type="submit" id="send-btn" class="primary">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor" aria-hidden="true"><path d="M12 2a10 10 0 0 0-8.6 15.100L2 22l5-1.3A10 10 0 1 0 12 2zm0 18.100c-1.5 0-2.900-.4-4.100-1.2l-.3-.2-3 .8.8-2.900-.2-.3A8.100 8.100 0 1 1 12 20.100zm4.500-6c-.2-.1-1.5-.7-1.7-.8s-.4-.1-.6.100-.6.800-.8 1-.3.200-.6.100a6.700 6.700 0 0 1-3.3-2.900c-.2-.4.200-.4.700-1.3.1-.1 0-.3 0-.4l-.8-1.800c-.2-.5-.4-.4-.6-.4h-.5a1 1 0 0 0-.7.300 3 3 0 0 0-.9 2.200 5.200 5.200 0 0 0 1.1 2.700 11.900 11.900 0 0 0 4.600 4c1.7.7 2.400.8 3.3.7a2.800 2.800 0 0 0 1.800-1.3 2.200 2.200 0 0 0 .2-1.3c-.1-.1-.3-.2-.5-.3z"/></svg>
        Send Thank-You on WhatsApp
      </button>
      <div class="secondary">
        <button type="button" id="copy-btn" class="outline">Copy Message</button>
        <button type="button" id="clear-btn" class="ghost">Clear</button>
      </div>
      <p id="status" class="status" role="status" aria-live="polite"></p>
    </form>
    <footer class="privacy">Privacy note: This tool does not store patient information. The mobile number and name are used only in your browser to prepare the WhatsApp message.</footer>
  </main>
  <script src="script.js"></script>
</body>
</html>
